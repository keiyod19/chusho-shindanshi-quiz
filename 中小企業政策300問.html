<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中小企業経営・政策 300問 演習アプリ</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#f1f4f8; --line:#e2e7ee;
    --txt:#1f2933; --muted:#6b7785; --accent:#ff5a36; --accent2:#2b7de9;
    --ok:#1f9d6b; --ng:#e23b4e; --gold:#c98a00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  header{
    background:#ffffff;
    border-bottom:3px solid var(--accent);
    padding:14px 18px; position:sticky; top:0; z-index:20;
    box-shadow:0 1px 6px rgba(31,41,51,.06);
  }
  header h1{margin:0; font-size:17px; letter-spacing:.02em}
  header .sub{color:var(--muted); font-size:12px; margin-top:2px}
  .wrap{max-width:820px; margin:0 auto; padding:18px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 1px 3px rgba(31,41,51,.05)}
  h2{font-size:15px; margin:0 0 12px; color:var(--accent2)}
  button{font-family:inherit; cursor:pointer}
  .btn{
    background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:11px 14px; font-size:14px; transition:.15s;
  }
  .btn:hover{border-color:var(--accent2)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4; cursor:not-allowed}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .modes{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .mode{
    background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    padding:16px; text-align:left; transition:.15s;
  }
  .mode:hover{border-color:var(--accent); transform:translateY(-2px)}
  .mode .t{font-size:15px; font-weight:700}
  .mode .d{font-size:12px; color:var(--muted); margin-top:4px}
  select{
    width:100%; background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-radius:10px; padding:11px; font-size:14px; font-family:inherit;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .spacer{flex:1}
  /* quiz */
  .qmeta{display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; margin-bottom:8px}
  .cat-chip{background:var(--panel2); border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-size:11px; color:var(--accent2)}
  .qtext{font-size:16px; font-weight:600; margin:6px 0 16px}
  .choices{display:flex; flex-direction:column; gap:10px}
  .choice{
    display:flex; gap:10px; align-items:flex-start; text-align:left;
    background:var(--panel2); border:1.5px solid var(--line); border-radius:11px;
    padding:13px 14px; font-size:14px; color:var(--txt); transition:.12s;
  }
  .choice:hover:not(:disabled){border-color:var(--accent2)}
  .choice .mark{
    flex:0 0 24px; height:24px; border-radius:50%; background:var(--bg); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--muted)
  }
  .choice.correct{border-color:var(--ok); background:rgba(39,192,138,.12)}
  .choice.correct .mark{background:var(--ok); color:#fff; border-color:var(--ok)}
  .choice.wrong{border-color:var(--ng); background:rgba(255,93,108,.12)}
  .choice.wrong .mark{background:var(--ng); color:#fff; border-color:var(--ng)}
  .choice:disabled{cursor:default}
  .explain{
    margin-top:14px; padding:14px; border-radius:11px; font-size:13.5px;
    background:var(--panel2); border:1px solid var(--line); display:none
  }
  .explain.show{display:block}
  .explain .verdict{font-weight:700; margin-bottom:6px}
  .explain .v-ok{color:var(--ok)}
  .explain .v-ng{color:var(--ng)}
  .progressbar{height:6px; background:var(--panel2); border-radius:999px; overflow:hidden; margin-top:10px}
  .progressbar>i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0}
  /* stats */
  .statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  .stat{background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:14px; text-align:center}
  .stat .n{font-size:24px; font-weight:800}
  .stat .l{font-size:11px; color:var(--muted); margin-top:2px}
  .catlist{margin-top:6px}
  .catrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px}
  .catrow:last-child{border:none}
  .catrow .cn{flex:1}
  .catrow .bar{flex:0 0 90px; height:7px; background:var(--bg); border-radius:999px; overflow:hidden}
  .catrow .bar>i{display:block; height:100%; background:var(--ok)}
  .catrow .pct{flex:0 0 70px; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}
  .hidden{display:none !important}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--accent); color:var(--txt);
    padding:10px 16px; border-radius:10px; font-size:13px; opacity:0; transition:.3s; pointer-events:none; z-index:50
  }
  .toast.show{opacity:1}
  .result-big{text-align:center; padding:10px 0}
  .result-big .score{font-size:46px; font-weight:900; color:var(--gold)}
  .result-big .msg{color:var(--muted); margin-top:4px; white-space:pre-line}
  footer{color:var(--muted); font-size:11px; text-align:center; padding:20px}
  a{color:var(--accent2)}
  @media(max-width:560px){ .modes,.grid{grid-template-columns:1fr} .statgrid{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<header>
  <h1>🧟 中小企業経営・政策 ／ 300問 演習アプリ</h1>
  <div class="sub">ゾンビランドサガ開発チーム制作 — 巽幸太郎プロデュース</div>
</header>

<div class="wrap">

  <!-- ===== HOME ===== -->
  <section id="home">
    <div class="card">
      <h2>モードを選べ！</h2>
      <div class="modes">
        <button class="mode" data-mode="category">
          <div class="t">📚 分野別演習</div>
          <div class="d">20分野から選んで集中攻略</div>
        </button>
        <button class="mode" data-mode="random">
          <div class="t">🎲 ランダム演習</div>
          <div class="d">全300問からシャッフル出題</div>
        </button>
        <button class="mode" data-mode="review">
          <div class="t">🔁 間違い復習</div>
          <div class="d">過去に間違えた問題だけ</div>
        </button>
        <button class="mode" data-mode="exam">
          <div class="t">📝 模試モード</div>
          <div class="d">本番形式・40問ランダム採点</div>
        </button>
      </div>
    </div>

    <div class="card" id="catPickCard" style="display:none">
      <h2>分野を選択</h2>
      <select id="catSelect"></select>
      <div style="height:12px"></div>
      <button class="btn primary" id="startCat" style="width:100%">この分野を始める</button>
    </div>

    <div class="card">
      <h2>📊 学習状況</h2>
      <div class="statgrid">
        <div class="stat"><div class="n" id="sAnswered">0</div><div class="l">回答数(延べ)</div></div>
        <div class="stat"><div class="n" id="sAcc">--%</div><div class="l">通算正答率</div></div>
        <div class="stat"><div class="n" id="sWrong">0</div><div class="l">復習対象</div></div>
      </div>
      <div class="catlist" id="catStats"></div>
      <div style="height:14px"></div>
      <button class="btn ghost" id="resetBtn" style="width:100%; color:var(--ng); border-color:var(--ng)">進捗をリセット</button>
    </div>
    <footer>収録 <b id="qcount">0</b> 問 ／ 進捗はこの端末に自動保存されます</footer>
  </section>

  <!-- ===== QUIZ ===== -->
  <section id="quiz" class="hidden">
    <div class="card">
      <div class="qmeta">
        <span class="cat-chip" id="qCat">分野</span>
        <span id="qCounter">1 / 1</span>
      </div>
      <div class="progressbar"><i id="qProg"></i></div>
      <div class="qtext" id="qText" style="margin-top:14px"></div>
      <div class="choices" id="qChoices"></div>
      <button class="btn ghost" id="passBtn" type="button" style="width:100%; margin-top:12px; color:var(--muted); border-style:dashed">🤔 わからない（パスして解説を見る・復習に追加）</button>
      <div class="explain" id="qExplain"></div>
      <div class="row" style="margin-top:16px">
        <button class="btn ghost" id="quitBtn">← 中断</button>
        <span class="spacer"></span>
        <span id="liveScore" style="color:var(--muted); font-size:13px"></span>
        <button class="btn primary" id="nextBtn" disabled>次へ →</button>
      </div>
    </div>
  </section>

  <!-- ===== RESULT ===== -->
  <section id="result" class="hidden">
    <div class="card">
      <h2>結果</h2>
      <div class="result-big">
        <div class="score" id="rScore">0 / 0</div>
        <div class="msg" id="rMsg"></div>
      </div>
      <div style="height:10px"></div>
      <div class="grid">
        <button class="btn" id="rReview">間違いだけ復習</button>
        <button class="btn primary" id="rHome">ホームへ戻る</button>
      </div>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
/* 中小企業経営・政策 演習問題バンク
   各問: {id, cat, q, choices[4], answer(正解index), exp(解説)} */
const QUESTIONS = [

/* ===== 1. 政府系金融機関・信用補完制度 ===== */
{id:"q001",cat:"政府系金融機関・信用補完",q:"日本政策金融公庫に関する記述として、最も適切なものはどれか。",
choices:["政府が100%出資する政策金融機関で、自ら直接融資を行う","民間融資に保証を付ける機関で、自ら融資は行わない","中小企業の組合への出資を主目的とする","預金の受け入れを主たる業務とする"],answer:0,
exp:"日本公庫は政府100%出資の政策金融機関で、民業を補完して直接融資を行う。保証を行うのは信用保証協会。"},
{id:"q002",cat:"政府系金融機関・信用補完",q:"日本政策金融公庫の事業区分として、適切でないものはどれか。",
choices:["国民生活事業","中小企業事業","農林水産事業","商工調停事業"],answer:3,
exp:"日本公庫は国民生活事業・中小企業事業・農林水産事業の3事業。商工調停事業は存在しない。"},
{id:"q003",cat:"政府系金融機関・信用補完",q:"商工組合中央金庫（商工中金）の特徴として、最も適切なものはどれか。",
choices:["政府と中小企業団体（組合等）の共同出資による","政府が100%出資している","預金の受け入れや債券発行は行えない","農林漁業者への融資を専門とする"],answer:0,
exp:"商工中金は政府と中小企業団体の共同出資。預金受入や債券発行など総合的な金融サービスを行う点が日本公庫と異なる。"},
{id:"q004",cat:"政府系金融機関・信用補完",q:"信用補完制度を構成する2つの仕組みの組み合わせとして、最も適切なものはどれか。",
choices:["信用保証（信用保証協会）と信用保険（日本政策金融公庫）","信用保証（日本公庫）と信用保険（保証協会）","直接融資（公庫）と債務保証（中央会）","出資（投資育成）と融資（公庫）"],answer:0,
exp:"信用補完制度は、信用保証協会の『信用保証』と日本公庫の『信用保険』の二階建て構造。主客の入替えが頻出のひっかけ。"},
{id:"q005",cat:"政府系金融機関・信用補完",q:"信用保証協会が金融機関に代位弁済した場合、日本公庫から協会へ支払われるものはどれか。",
choices:["保険金","補助金","出資金","利子補給金"],answer:0,
exp:"代位弁済が発生すると、信用保険に基づき日本公庫から保証協会へ保険金（通常7〜8割）が支払われ、協会の負担を軽減する。"},
{id:"q006",cat:"政府系金融機関・信用補完",q:"責任共有制度に関する記述として、最も適切なものはどれか。",
choices:["原則として協会80%・金融機関20%でリスクを分担する","協会が常に100%保証する","金融機関が80%を負担する","保証料を国が全額負担する"],answer:0,
exp:"責任共有制度は原則協会80%・金融機関20%。金融機関の審査・伴走支援を促す狙い。創業や危機関連等は例外的に100%保証。"},
{id:"q007",cat:"政府系金融機関・信用補完",q:"政府系金融機関による融資の一般的な特徴として、最も適切なものはどれか。",
choices:["民間より長期・固定金利のメニューが多い","民間と競合し協調融資は行わない","短期・変動金利が中心である","担保がなければ一切利用できない"],answer:0,
exp:"政府系は長期・固定金利で設備投資の資金繰りを安定させる。民間との協調融資も診断士の定番アプローチ。"},
{id:"q008",cat:"政府系金融機関・信用補完",q:"信用保証制度における『責任共有制度の対象外（100%保証）』に該当しにくいものはどれか。",
choices:["一般保証（通常の保証）","創業関連保証","危機関連保証","セーフティネット保証1号"],answer:0,
exp:"一般保証は原則80%（責任共有対象）。創業・危機関連・セーフティネット1〜4号などは100%保証の対象。"},

/* ===== 2. 日本公庫の融資制度 ===== */
{id:"q009",cat:"日本公庫の融資制度",q:"セーフティネット貸付（経営環境変化対応資金）の対象として、最も適切なものはどれか。",
choices:["環境変化で一時的に業況悪化したが中長期的に回復が見込まれる中小企業","倒産が確定した中小企業","創業前の者に限る","農林漁業者に限る"],answer:0,
exp:"『回復が見込まれる』ことが条件。倒産寸前ではなく再起可能な企業が対象。創業後の年数制限はない。"},
{id:"q010",cat:"日本公庫の融資制度",q:"国民生活事業におけるセーフティネット貸付の融資限度額として、最も適切なものはどれか。",
choices:["4,800万円","7,200万円","2,000万円","1億円"],answer:0,
exp:"国民生活事業のセーフティネット貸付は4,800万円。『危機でシワ（48）が寄る』で記憶。"},
{id:"q011",cat:"日本公庫の融資制度",q:"セーフティネット貸付（国民生活事業）の設備資金の返済期間として、最も適切なものはどれか。",
choices:["15年以内（据置3年以内）","20年以内（据置2年以内）","10年以内（据置1年以内）","7年以内（据置2年以内）"],answer:0,
exp:"セーフティネットの設備は15年以内・据置3年以内、運転は8年以内・据置3年以内。創業系より据置が1年長い。"},
{id:"q012",cat:"日本公庫の融資制度",q:"『女性、若者／シニア起業家支援資金』の年齢要件として、最も適切なものはどれか。",
choices:["女性は年齢不問、若者は35歳未満、シニアは55歳以上","女性は35歳未満、若者は40歳未満","女性は55歳以上に限る","全員50歳以上"],answer:0,
exp:"女性は年齢不問、若者35歳未満、シニア55歳以上。『35歳未満の女性』は誤り。"},
{id:"q013",cat:"日本公庫の融資制度",q:"新規開業資金や女性若者シニア資金の『創業後』の対象期間として、最も適切なものはどれか。",
choices:["新規開業またはおおむね創業後7年以内","創業前の者に限る","創業後3年以内に限る","創業後10年以内"],answer:0,
exp:"これから始める人だけでなく、創業後おおむね7年以内も対象。『創業前に限る』は誤り。"},
{id:"q014",cat:"日本公庫の融資制度",q:"創業系資金（国民生活事業）の融資限度額として、最も適切なものはどれか。",
choices:["7,200万円（うち運転4,800万円）","4,800万円","7億2,000万円","2,000万円"],answer:0,
exp:"創業系（新規開業・女性若者シニア）は国民生活事業で7,200万円（うち運転4,800万円）。中小企業事業ならその10倍の7.2億円。"},
{id:"q015",cat:"日本公庫の融資制度",q:"創業系資金（女性若者シニア・新規開業）の設備資金の返済期間として、最も適切なものはどれか。",
choices:["20年以内（据置2年以内）","15年以内（据置3年以内）","10年以内","30年以内"],answer:0,
exp:"創業系の設備は20年以内・据置2年以内、運転は7年以内・据置2年以内。『ハタチ（20）の若者からシニア（7）まで』。"},
{id:"q016",cat:"日本公庫の融資制度",q:"中小企業事業における創業系資金の融資限度額として、最も適切なものはどれか。",
choices:["7億2,000万円（うち運転2億5,000万円）","7,200万円","4,800万円","3億円"],answer:0,
exp:"中小企業事業は国民生活事業の10倍の7.2億円。運転枠は『事故（25＝2.5億円）』で記憶。"},
{id:"q017",cat:"日本公庫の融資制度",q:"セーフティネット貸付と創業系資金の『据置期間』の違いとして、最も適切なものはどれか。",
choices:["セーフティネットが3年以内、創業系が2年以内","両方とも3年以内","両方とも2年以内","セーフティネットが2年、創業系が3年"],answer:0,
exp:"経営危機のセーフティネットは据置3年以内、立ち上げ期の創業系は2年以内。危機の方が猶予が1年長い。"},

/* ===== 3. 信用保証協会・セーフティネット保証 ===== */
{id:"q018",cat:"セーフティネット保証・危機関連",q:"セーフティネット保証を利用するために必要な手続きとして、最も適切なものはどれか。",
choices:["事業所所在地の市町村長（区市町村長）の認定","都道府県知事の認定","経済産業大臣の認定","公正取引委員会の承認"],answer:0,
exp:"セーフティネット保証は市町村長の認定が必要。固定資産税が市町村税であることと同様、認定も市区町村レベル。"},
{id:"q019",cat:"セーフティネット保証・危機関連",q:"セーフティネット保証1号の対象として、最も適切なものはどれか。",
choices:["連鎖倒産防止（大型倒産事業者の関連中小企業者）","自然災害による被害","業況悪化業種","金融機関の破綻"],answer:0,
exp:"1号は連鎖倒産防止。4号が自然災害、5号が業況悪化業種、6号が取引金融機関の破綻。"},
{id:"q020",cat:"セーフティネット保証・危機関連",q:"セーフティネット保証5号の保証割合として、最も適切なものはどれか。",
choices:["80%（責任共有の対象）","100%","90%","50%"],answer:0,
exp:"5号だけが責任共有の対象で80%保証。1〜4号・6号は100%保証。『5号は100%』は定番ひっかけ。"},

choices:["計画提出は延長されたが、承継実行（2027年末）は延長されない見込み","両方とも延長された","両方とも据え置き","計画提出のみ据え置き"],answer:0,
exp:"特例承継計画の提出期限は延長（2026/3→2027/9）されたが、贈与・相続の実行期限（2027年末）は延長されない見込み。"},
{id:"q298",cat:"取引適正化（取適法等）",q:"取適法の用語変更として、適切でないものはどれか。",
choices:["『委託事業者』を『親事業者』に変更","『親事業者』を『委託事業者』に変更","『下請事業者』を『中小受託事業者』に変更","『下請代金』を『製造委託等代金』に変更"],answer:0,
exp:"上下関係を連想させる『下請』『親事業者』を改めた。親事業者→委託事業者、下請事業者→中小受託事業者。"},
{id:"q299",cat:"基本法・範囲・政策変遷",q:"新・中小企業基本法が前提とする中小企業の基本姿勢として、最も適切なものはどれか。",
choices:["独立した中小企業の自主的な努力","国による全面的な保護","大企業への従属","市場からの退出"],answer:0,
exp:"新基本法は『独立した中小企業の自主的な努力』を前提に、3つの政策の柱で支援する自立支援型。"},
{id:"q300",cat:"基本法・範囲・政策変遷",q:"中小企業憲章の閣議決定年として、最も適切なものはどれか。",
choices:["2010年","1999年","2014年","1963年"],answer:0,
exp:"中小企業憲章は2010年6月閣議決定。中小企業を社会の主役と位置づける理念文書（法律ではない）。"},

];

</script>
<script>
/* =================== データ層 =================== */
const LS_KEY = 'cks_progress_v1';
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {stats:{}, wrong:[]}; }
  catch(e){ return {stats:{}, wrong:[]}; }
}
function saveProgress(p){ localStorage.setItem(LS_KEY, JSON.stringify(p)); }
let progress = loadProgress();

// stats: { [qid]: {c:正解数, w:不正解数} }
// wrong: [qid,...]  間違い未克服リスト
function recordAnswer(qid, correct){
  const s = progress.stats[qid] || {c:0,w:0};
  if(correct){ s.c++; } else { s.w++; }
  progress.stats[qid] = s;
  const idx = progress.wrong.indexOf(qid);
  if(correct){ if(idx>=0) progress.wrong.splice(idx,1); }   // 正解したら復習リストから除外
  else { if(idx<0) progress.wrong.push(qid); }
  saveProgress(progress);
}

/* =================== ユーティリティ =================== */
const $ = id => document.getElementById(id);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function showToast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
function show(sec){ ['home','quiz','result'].forEach(s=>$(s).classList.toggle('hidden', s!==sec)); window.scrollTo(0,0); }

const CATS = [...new Set(QUESTIONS.map(q=>q.cat))];

/* =================== ホーム描画 =================== */
function renderHome(){
  $('qcount').textContent = QUESTIONS.length;
  // カテゴリ選択
  const sel = $('catSelect'); sel.innerHTML='';
  CATS.forEach(c=>{
    const n = QUESTIONS.filter(q=>q.cat===c).length;
    const o=document.createElement('option'); o.value=c; o.textContent=`${c}（${n}問）`; sel.appendChild(o);
  });
  // 統計
  let answered=0, correct=0;
  Object.values(progress.stats).forEach(s=>{ answered+=s.c+s.w; correct+=s.c; });
  $('sAnswered').textContent = answered;
  $('sAcc').textContent = answered? Math.round(correct/answered*100)+'%' : '--%';
  $('sWrong').textContent = progress.wrong.length;
  // 分野別正答率
  const cl=$('catStats'); cl.innerHTML='';
  CATS.forEach(c=>{
    const ids = QUESTIONS.filter(q=>q.cat===c).map(q=>q.id);
    let a=0,cc=0;
    ids.forEach(id=>{ const s=progress.stats[id]; if(s){ a+=s.c+s.w; cc+=s.c; } });
    const pct = a? Math.round(cc/a*100):0;
    const row=document.createElement('div'); row.className='catrow';
    row.innerHTML = `<span class="cn">${c}</span>
      <span class="bar"><i style="width:${a?pct:0}%"></i></span>
      <span class="pct">${a? pct+'%':'未'} </span>`;
    cl.appendChild(row);
  });
}

/* =================== 出題エンジン =================== */
let session = null; // {list, idx, score, mode, answeredThis}

function startSession(list, mode){
  if(list.length===0){ showToast('対象の問題がありません'); return; }
  session = { list, idx:0, score:0, mode, done:0 };
  show('quiz');
  renderQuestion();
}

function renderQuestion(){
  const q = session.list[session.idx];
  $('qCat').textContent = q.cat;
  $('qCounter').textContent = `${session.idx+1} / ${session.list.length}`;
  $('qProg').style.width = (session.idx/session.list.length*100)+'%';
  $('qText').textContent = q.q;
  $('liveScore').textContent = `正解 ${session.score} / ${session.done}`;
  // 選択肢シャッフル（正解位置を固定しない）
  const order = shuffle(q.choices.map((c,i)=>({c,i})));
  const box=$('qChoices'); box.innerHTML='';
  const labels=['ア','イ','ウ','エ','オ'];
  order.forEach((item,pos)=>{
    const b=document.createElement('button'); b.className='choice'; b.type='button';
    b.innerHTML = `<span class="mark">${labels[pos]}</span><span>${item.c}</span>`;
    b.onclick = ()=>pick(b, item.i===q.answer, q, box);
    box.appendChild(b);
  });
  const ex=$('qExplain'); ex.className='explain'; ex.innerHTML='';
  $('passBtn').style.display='block'; $('passBtn').disabled=false;
  $('nextBtn').disabled = true;
  $('nextBtn').textContent = (session.idx===session.list.length-1)?'結果へ →':'次へ →';
}

function pick(btn, isCorrect, q, box){
  [...box.children].forEach(c=>c.disabled=true);
  $('passBtn').style.display='none';
  session.done++;
  if(isCorrect){ btn.classList.add('correct'); session.score++; }
  else{
    btn.classList.add('wrong');
    // 正解の選択肢を強調
    [...box.children].forEach(c=>{
      if(c.querySelector('span:last-child').textContent === q.choices[q.answer]) c.classList.add('correct');
    });
  }
  recordAnswer(q.id, isCorrect);
  const ex=$('qExplain');
  ex.classList.add('show');
  ex.innerHTML = `<div class="verdict ${isCorrect?'v-ok':'v-ng'}">${isCorrect?'◯ 正解！':'✗ 不正解'}</div>
    <div><b>正解：</b>${q.choices[q.answer]}</div>
    <div style="margin-top:6px">${q.exp}</div>`;
  $('liveScore').textContent = `正解 ${session.score} / ${session.done}`;
  $('nextBtn').disabled = false;
}

function passQuestion(){
  const q = session.list[session.idx];
  const box = $('qChoices');
  [...box.children].forEach(c=>{
    c.disabled=true;
    if(c.querySelector('span:last-child').textContent === q.choices[q.answer]) c.classList.add('correct');
  });
  $('passBtn').style.display='none';
  session.done++;
  recordAnswer(q.id, false);   // パスは「不正解扱い」で復習リストに追加
  const ex=$('qExplain');
  ex.classList.add('show');
  ex.innerHTML = `<div class="verdict" style="color:var(--accent2)">🤔 パスしました（復習対象に追加）</div>
    <div><b>正解：</b>${q.choices[q.answer]}</div>
    <div style="margin-top:6px">${q.exp}</div>`;
  $('liveScore').textContent = `正解 ${session.score} / ${session.done}`;
  $('nextBtn').disabled = false;
}

function nextQuestion(){
  if(session.idx < session.list.length-1){ session.idx++; renderQuestion(); }
  else{ finishSession(); }
}

function finishSession(){
  show('result');
  const total=session.list.length, sc=session.score;
  $('rScore').textContent = `${sc} / ${total}`;
  const pct = Math.round(sc/total*100);
  let msg;
  if(pct>=80) msg='よぉぉし！合格ラインだ、その調子でブチかませ！🔥';
  else if(pct>=60) msg='あと一歩っちゃ！間違いを復習で潰そう！';
  else msg='オイ、ここが伸びしろだ。復習でバチッと固めろや！';
  $('rMsg').textContent = `正答率 ${pct}%\n${msg}`;
  // この回で間違えたものを復習候補に
  session._wrongIds = session.list.filter((q,i)=>true).map(q=>q.id).filter(id=>progress.wrong.includes(id));
}

/* =================== イベント =================== */
document.querySelectorAll('.mode').forEach(m=>{
  m.onclick = ()=>{
    const mode = m.dataset.mode;
    if(mode==='category'){
      $('catPickCard').style.display='block';
      $('catPickCard').scrollIntoView({behavior:'smooth'});
    } else if(mode==='random'){
      startSession(shuffle(QUESTIONS), 'random');
    } else if(mode==='review'){
      const list = QUESTIONS.filter(q=>progress.wrong.includes(q.id));
      if(list.length===0){ showToast('復習対象はありません。まず演習しよう！'); return; }
      startSession(shuffle(list), 'review');
    } else if(mode==='exam'){
      startSession(shuffle(QUESTIONS).slice(0,40), 'exam');
    }
  };
});
$('startCat').onclick = ()=>{
  const c = $('catSelect').value;
  startSession(shuffle(QUESTIONS.filter(q=>q.cat===c)), 'category');
};
$('nextBtn').onclick = nextQuestion;
$('passBtn').onclick = passQuestion;
$('quitBtn').onclick = ()=>{ if(confirm('中断してホームに戻りますか？（進捗は保存済み）')){ renderHome(); show('home'); } };
$('rHome').onclick = ()=>{ renderHome(); show('home'); };
$('rReview').onclick = ()=>{
  const list = QUESTIONS.filter(q=>progress.wrong.includes(q.id));
  if(list.length===0){ showToast('間違いはありません！満点級だ🔥'); renderHome(); show('home'); return; }
  startSession(shuffle(list),'review');
};
$('resetBtn').onclick = ()=>{
  if(confirm('全ての学習進捗を消去します。よろしいですか？')){
    progress={stats:{},wrong:[]}; saveProgress(progress); renderHome(); showToast('リセットしました');
  }
};

/* =================== 起動 =================== */
renderHome();
show('home');
</script>
</body>
